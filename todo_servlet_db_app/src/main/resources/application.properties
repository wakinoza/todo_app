spring.application.name=webapp
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:todo_db}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER_NAME:todo_user}
spring.datasource.password=${DB_PASSWORD:todo_user_password}

spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax