<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{common/layout :: head('ログイン結果')}"></head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card shadow-sm border-0 p-4">
                    
                    <!-- ログイン成功時（sessionにloginUserがある場合） -->
                    <div th:if="${session.loginUser}">
                        <h1 class="h3 text-success mb-4">ログインに成功しました</h1>
                        <p class="lead mb-4">ようこそ <span class="fw-bold" th:text="${session.loginUser.name}"></span> さん</p>
                        <a th:href="@{/todo/list}" class="btn btn-primary btn-lg w-100">Todo一覧を確認する</a>
                    </div>

                    <!-- ログイン失敗時（sessionにloginUserがない場合） -->
                    <div th:unless="${session.loginUser}">
                        <h1 class="h3 text-danger mb-4">ログインに失敗しました</h1>
                        <p class="text-muted mb-4">ユーザー名またはパスワードが正しくありません。</p>
                        <a th:href="@{/login}" class="btn btn-outline-secondary w-100">TOP（ログイン画面）へ</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{common/layout :: footer}"></div>
</body>
</html>
